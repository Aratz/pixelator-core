name: release-please

on:
  push:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Update release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A PAT or GitHub App token is required: events created with GITHUB_TOKEN
      # do not trigger other workflows, so wheels.yml would never run on the release.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
